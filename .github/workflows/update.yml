name: Update repo

on:
  push:
    paths: [repos]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Collect debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/debs
          while read -r name; do
            case "$name" in ''|\#*) continue;; esac
            echo "== $name"
            gh release download --repo "cursorus/$name" --pattern '*.deb' --dir site/debs --clobber </dev/null || echo "no release: $name"
          done < repos

      - name: Index
        run: |
          cd site
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -k -9 Packages
          bzip2 -k -9 Packages
          cat > Release <<EOF
          Origin: cursorus
          Label: cursorus
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm iphoneos-arm64
          Components: main
          Description: cursorus tweaks
          EOF
          echo "<h1>cursorus repo</h1>" > index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
